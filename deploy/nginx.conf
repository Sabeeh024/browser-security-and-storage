# nginx — serve a built Vite SPA with the same header set as server/prod.js.
# Include inside a server{} block. Adjust connect-src to your API origin.

server {
  listen 443 ssl http2;
  server_name app.example.com;
  root /var/www/app/dist;

  # --- security headers (always = also on error responses) ---
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.example.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /csp-report" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # hashed assets — cache hard
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback — never cache the HTML shell
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

# Redirect http -> https
server {
  listen 80;
  server_name app.example.com;
  return 301 https://$host$request_uri;
}
